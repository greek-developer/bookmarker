name: Release

on:
  push:
    branches:
      - release/production

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Nerdbank.GitVersioning can compute the git height

      - name: Setup Build Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Derives the version from version.json + git height and exports it to the
      # steps below as NBGV_* environment variables. The build itself picks the
      # version up automatically via the Nerdbank.GitVersioning package.
      - name: Set Version
        run: |
          dotnet tool install --global nbgv --version 3.10.91
          nbgv cloud -a

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish src/Bookmarker/Bookmarker.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./release/win-x64

      - name: Publish Linux x64
        run: >
          dotnet publish src/Bookmarker/Bookmarker.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./release/linux-x64

      - name: Bundle install scripts (Windows only)
        run: |
          cp scripts/install-on-program-files.ps1   ./release/win-x64/

      - name: Zip Artifacts
        run: |
          cd release
          zip -r bookmarker-v${NBGV_SimpleVersion}-win-x64.zip   win-x64/
          zip -r bookmarker-v${NBGV_SimpleVersion}-linux-x64.zip linux-x64/

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${NBGV_SimpleVersion}
          git push origin v${NBGV_SimpleVersion}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NBGV_SimpleVersion }}
          name: v${{ env.NBGV_SimpleVersion }}
          generate_release_notes: true
          files: |
            release/bookmarker-v${{ env.NBGV_SimpleVersion }}-win-x64.zip
            release/bookmarker-v${{ env.NBGV_SimpleVersion }}-linux-x64.zip
