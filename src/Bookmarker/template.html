<!DOCTYPE html>
<!--
  Bookmarker — template.html  (Direction "Shell")
  Drop-in replacement for src\Bookmarker\template.html.

  The server replaces exactly two placeholders (global string replace):
    {{content}} — the tab/section/link structure (input -> label -> div triplets)
    {{footer}}  — a plain config file-path string

  Non-obvious CSS notes
  ─────────────────────
  · The content MUST stay wrapped in <div class="tabs"> — the backend emits a
    flat run of (radio → label → div) triplets and every selector here is
    scoped to that .tabs container.
  · CSS-only tabs, no JS: .tabs is a flex row. Every <label> gets order:0 so
    the labels group into one row; the single :checked <div> gets order:1 +
    width:100% so it drops onto its own line below the row. Sibling selectors
    (input:checked + label + div) match on DOM order and are unaffected by the
    visual `order`, so the required radio trick keeps working as-is.
  · Native <details> markers are removed and redrawn as [+]/[-] (sections) and
    > (groups) via summary::before, flipped on the [open] attribute.
  · Section bodies use CSS multi-column to fill desktop width; groups/lists set
    break-inside:avoid so they never split across a column.
  · A <li> with no <a> (e.g. "VPN status:") is detected with :not(:has(a)) and
    rendered as a dimmed label rather than a link row.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bookmarker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#16181d;
  --bg-2:#1b1e24;
  --line:#262a32;
  --line-soft:#21242b;
  --fg:#e3e6ec;        /* main link / strong text */
  --fg-dim:#9aa0ac;    /* secondary */
  --fg-faint:#5b616c;  /* pipes, meta */
  --accent:#3fd7d6;    /* cyan */
  --accent-dim:#2a9c9b;
  --mono:"Fira Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--fg-dim);
  font-family:var(--mono);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:34px 40px 60px;
  position:relative;
}
/* faint scanline texture — purely atmospheric, very low contrast */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);
}
.wrap{position:relative;z-index:1}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;border-bottom:1px solid var(--line);
  padding-bottom:18px;margin-bottom:26px;
}
.brand{display:flex;align-items:baseline;gap:10px;font-size:18px;font-weight:600;color:var(--fg);letter-spacing:.5px}
.brand .sigil{color:var(--accent);text-shadow:0 0 10px rgba(63,215,214,.55);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.brand .sigil{animation:none}}
.brand .sub{font-size:12px;font-weight:400;color:var(--fg-faint);letter-spacing:.3px}

/* ---------- tabs (CSS-only radio trick) ---------- */
.tabs{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0 4px}
.tabs > input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;clip:rect(0 0 0 0)}
.tabs > label{
  order:0;cursor:pointer;user-select:none;white-space:nowrap;
  font-size:13px;font-weight:500;color:var(--fg-faint);
  padding:7px 14px;border:1px solid transparent;border-radius:5px 5px 0 0;
  border-bottom:2px solid transparent;
  transition:color .12s ease,border-color .12s ease;
}
.tabs > label:hover{color:var(--fg-dim)}
.tabs > input:checked + label{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 9px rgba(63,215,214,.45)}
.tabs > input:focus-visible + label{outline:1px solid var(--accent-dim);outline-offset:2px}
.tabs > label::before{content:"●";font-size:8px;color:var(--fg-faint);margin-right:8px;vertical-align:middle;opacity:.5}
.tabs > input:checked + label::before{color:var(--accent);opacity:1}

.tabs > div{
  order:1;flex-basis:100%;width:100%;display:none;
  border-top:1px solid var(--line);margin-top:-1px;padding-top:28px;
}
.tabs > input:checked + label + div{display:block}

/* ---------- sections (<details><summary><h2>) ---------- */
.tabs > div > details{margin:0 0 30px}
.tabs > div > details > summary,
.tabs > div > details > div > details > summary{
  list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;
}
summary::-webkit-details-marker{display:none}

.tabs > div > details > summary{
  border-bottom:1px solid var(--line-soft);padding-bottom:8px;margin-bottom:16px;
}
.tabs h2{
  margin:0;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--fg);white-space:nowrap;
}
.tabs h2::before{content:"~$ ";color:var(--accent);font-weight:700;text-shadow:0 0 8px rgba(63,215,214,.4)}
.tabs > div > details > summary::before{
  content:"[+]";color:var(--accent-dim);font-size:13px;line-height:1.2;width:30px;letter-spacing:-1px;
}
.tabs > div > details[open] > summary::before{content:"[-]";color:var(--accent)}

/* ---------- groups (named <details><summary><h3>) ---------- */
.tabs > div > details > div{
  column-width:430px;column-gap:40px;
}
.tabs > div > details > div > details,
.tabs > div > details > div > ul{
  break-inside:avoid;margin:0 0 22px;
}
.tabs > div > details > div > details > summary{margin-bottom:11px}
.tabs h3{
  margin:0;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  line-height:1.4;color:var(--fg-dim);
}
.tabs > div > details > div > details > summary::before{
  content:">";color:var(--fg-faint);font-size:12px;font-weight:700;width:12px;
}
.tabs > div > details > div > details[open] > summary::before{content:">";color:var(--accent-dim)}

/* ---------- links ---------- */
.tabs ul{list-style:none;margin:0;padding:0}
.tabs li{
  color:var(--fg-faint);
  padding:3px 0 3px 14px;position:relative;
  text-indent:0;
}
.tabs li::before{
  content:"";position:absolute;left:0;top:11px;width:5px;height:1px;background:var(--line);
}
.tabs li a{text-decoration:none;border-radius:3px;transition:color .1s ease}
.tabs li a:first-of-type{color:var(--fg);font-weight:500}
.tabs li a:not(:first-of-type){color:var(--fg-dim);font-weight:400;font-size:13px}
.tabs li a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px;text-shadow:0 0 8px rgba(63,215,214,.4)}
.tabs li a:focus-visible{outline:1px solid var(--accent-dim);outline-offset:2px;color:var(--accent)}
/* plain label rows (no link) */
.tabs li:not(:has(a)){
  color:var(--fg-faint);font-style:normal;letter-spacing:.4px;
  text-transform:none;margin-top:6px;
}
.tabs li:not(:has(a))::before{background:transparent}

/* ---------- footer ---------- */
footer{
  margin-top:54px;border-top:1px solid var(--line);padding-top:16px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;
  font-size:12px;color:var(--fg-faint);
}
footer .path{color:var(--fg-dim)}
footer .path .k{color:var(--accent-dim);margin-right:8px}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">bookmarker<span class="sigil">▍</span><span class="sub">~/ start page</span></div>
  </header>

  <!-- The .tabs wrapper is required; the token below is the radio/label/div run. -->
  <div class="tabs">
    {{content}}
  </div>

  <footer>
    <span class="path"><span class="k">config</span>{{footer}}</span>
    <span>© 2026 bookmarker</span>
  </footer>

</div>
</body>
</html>
